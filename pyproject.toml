[project]
name = "sycal"
version = "0.1.0"
description = "SyCal.ai: turn a course syllabus into an .ics calendar with a mini-swe-agent (CS 179M Group 10)"
requires-python = ">=3.12"
dependencies = [
    "mini-swe-agent>=2.4",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
    "icalendar>=6.0",
    "pyyaml>=6.0",
    "tzdata",  # zoneinfo has no timezone database on Windows without it
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sycal", "agent", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
