# Model profiles for `python -m agent.run --model <profile>`. Owner: Sid.
# Each profile is passed to mini-swe-agent's get_model(); ${VARS} are read from the environment.
# Local Ollama models cost $0, so cost tracking errors are ignored for them.
# If Ollama can't use your GPU, set SYCAL_NUM_GPU=0 to force CPU on your machine (see agent/run.py).

qwen-local:
  model_name: ollama_chat/qwen3:4b
  model_class: litellm_textbased
  cost_tracking: ignore_errors
  model_kwargs:
    api_base: http://localhost:11434
    temperature: 0
    num_ctx: 16384
    think: false
    drop_params: true

gemma-local:
  model_name: ollama_chat/gemma4:e2b
  model_class: litellm_textbased
  cost_tracking: ignore_errors
  model_kwargs:
    api_base: http://localhost:11434
    temperature: 0
    num_ctx: 16384
    drop_params: true

# PLACEHOLDER: confirm the provider/model id and set OPENAI_API_KEY before use.
luna:
  model_name: openai/gpt-6-luna
  model_class: litellm_textbased
  model_kwargs:
    temperature: 0
    drop_params: true

# PLACEHOLDER: stronger comparison model on NRP (OpenAI-compatible endpoint), Week 8.
nrp-strong:
  model_name: openai/${NRP_MODEL}
  model_class: litellm_textbased
  cost_tracking: ignore_errors
  model_kwargs:
    api_base: ${NRP_API_BASE}
    api_key: ${NRP_API_KEY}
    temperature: 0
    drop_params: true
